<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>台灣大富翁</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/monopoly.css">
</head>
<body class="mono">
<canvas id="stage"></canvas>
<div id="lens"><i class="far"></i><i class="near"></i><i class="vignette"></i></div>
<main id="hud" hidden>
  <div id="ledger"></div>
  <div id="round"></div>
  <div id="log"></div>
  <div id="deed" hidden></div>
  <div id="shout" hidden></div>
  <div id="floats"></div>
  <div id="cardpop" hidden></div>
  <div id="actions"></div>
  <div id="hint" hidden></div>
  <div id="toggles">
    <button id="view" class="btn quiet">視角歸位</button>
    <button id="motion" class="btn quiet">動畫：完整</button>
    <button id="mute" class="btn quiet">音效：開</button>
  </div>
</main>
<div id="overlay" hidden></div>
<script src="js/vendor/three.min.js"></script>
<script src="js/vendor/cannon.min.js"></script>
<script src="js/mono/board.js"></script>
<script src="js/mono/game.js"></script>
<script src="js/mono/ai.js"></script>
<script src="js/mono/scene.js"></script>
<script src="js/mono/net.js"></script>
<script src="js/mono/ui.js"></script>
</body>
</html>
